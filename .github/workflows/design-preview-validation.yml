name: Design Preview Validation
# Validates design changes before they reach the mobile preview.

on:
  push:
    branches:
      - design/phase-1-dashboard-pos-2026-11-25
  pull_request:
    branches:
      - preview/mobile-test-2026-11-25
    paths:
      - 'src/components/dashboard/**'
      - 'src/components/pos/**'
      - 'src/index.css'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/design-preview-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PDF validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript

      - name: Run full verification
        run: npm run verify
