name: ERP CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python for SQLite schema verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ghostscript for independent PDF validation
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript
          gs --version

      - name: Verify SQLite schema, transactions, persistence and backup
        run: python scripts/verify_sqlite_schema.py

      - name: Verify SQLite application runtime, migrations and restart persistence
        run: node scripts/verify_sqlite_runtime.mjs

      - name: Verify desktop authentication and lockout
        run: node scripts/verify_sqlite_auth.mjs

      - name: Verify legacy backup import and financial parity
        run: node scripts/verify_sqlite_import.mjs

      - name: Check Electron main and preload syntax
        run: node --check electron/main.mjs && node --check electron/preload.cjs && node --check electron/security/authentication.mjs

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck / lint
        run: npm run lint

      - name: Verify UI data-service boundary
        run: npm run verify:architecture

      - name: Run unit & regression tests (node:test)
        run: npm test

      - name: Run SQLite desktop backend E2E & module tests
        run: npm run test:sqlite

      - name: Run legacy remediation & E2E suites
        run: npm run test:legacy

      - name: Production Vite build
        run: npm run build

      - name: Upload installable PWA build artifact
        uses: actions/upload-artifact@v4
        with:
          name: erp-pwa-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  sqlite-electron-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Electron embedded Node.js line
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'

      - name: Verify SQLite persistence and migrations on Node 24
        run: node scripts/verify_sqlite_runtime.mjs

      - name: Verify main-process authentication on Node 24
        run: node scripts/verify_sqlite_auth.mjs

      - name: Verify legacy backup import on Node 24
        run: node scripts/verify_sqlite_import.mjs

      - name: Run SQLite desktop backend tests on Node 24
        run: node --test scripts/tests/*.test.mjs

      - name: Check Electron main, preload and security modules
        run: node --check electron/main.mjs && node --check electron/preload.cjs && node --check electron/security/authentication.mjs

  windows-exe-preview:
    runs-on: windows-latest
    steps:
      - name: Enable long Git paths for existing Arabic PDF filenames
        run: git config --global core.longpaths true
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Build React renderer
        run: npm run build
      - name: Package Windows x64 NSIS preview
        run: npx --yes electron-builder@26.18.1 --win nsis --x64 --publish never
      - name: Upload Windows EXE preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: amro-windows-exe-shell-preview-${{ github.sha }}
          path: release/windows-preview/*.exe
          if-no-files-found: error
          retention-days: 14
