name: ERP CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck / lint
        run: npm run lint

      - name: Run unit & regression tests (node:test)
        run: npm test

      - name: Run legacy remediation & E2E suites
        run: npm run test:legacy

      - name: Production Vite build
        run: npm run build

      - name: Upload installable PWA build artifact
        uses: actions/upload-artifact@v4
        with:
          name: erp-pwa-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
