name: Mobile PWA Preview

on:
  push:
    branches:
      - preview/mobile-test-2026-11-25
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Share the Pages deployment lock with the repository's default Pages workflow.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: mobile-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build mobile PWA
        run: npm run build

      - name: Upload PWA files
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy mobile preview
        id: deployment
        uses: actions/deploy-pages@v4
